# One-step install: conda env create -f environment.yml
# Installs RFoldseek with CD-HIT-EST (database clustering) and US-align
# (RFoldseek-TM and E-value calibration), which pip cannot provide.
# The numerical stack comes from conda-forge so torch and numba share one
# OpenMP runtime; mixing their pip wheels aborts numba's thread pool on macOS.
name: rfoldseek
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pip
  - numpy
  - scipy
  - numba
  - pytorch
  - biotite
  - cd-hit
  - usalign
  - pip:
      - .
