[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rfoldseek"
version = "0.1.0"
description = "Fast RNA tertiary-structure search with the learned 3Dr structural alphabet"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    # The last biotite for Python 3.9 (0.40) is built against NumPy 1.
    "numpy<2; python_version < '3.10'",
    "torch>=2.0",
    "numba>=0.55",
    "scipy>=1.0",
    "biotite>=0.40",
]

[project.scripts]
rfoldseek = "rfoldseek.cli:main"

[tool.setuptools.packages.find]
include = ["rfoldseek*"]

[tool.setuptools.package-data]
rfoldseek = ["assets/*"]
