[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rfoldsearch"
version = "0.1.0"
description = "Fast RNA tertiary-structure search with the learned 3Dr structural alphabet"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
    "torch>=2.0",
    "numba>=0.55",
    # SciPy 1.15.x wheels fail to load on current macOS (dyld rejects their
    # __thread_bss section); 1.14 and 1.16+ load normally. Python 3.10 then
    # resolves to 1.14.1.
    "scipy>=1.0,!=1.15.*",
    "biotite>=0.40",
]

[project.scripts]
rfoldsearch = "rfoldsearch.cli:main"

[tool.setuptools.packages.find]
include = ["rfoldsearch*"]

[tool.setuptools.package-data]
rfoldsearch = ["assets/*"]
